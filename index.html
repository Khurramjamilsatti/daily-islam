      display: flex;

      width: 168px;
      height: 168px;

      color: #C6A15B;

  <script>
    (function () {

      function done() {
        if (!node || node.dataset.done === '1') return;
        node.dataset.done = '1';
        node.classList.add('di-hide');
        setTimeout(function () {
          if (node.parentNode) node.parentNode.removeChild(node);
        }, 420);

      window.addEventListener('flutter-first-frame', done);
